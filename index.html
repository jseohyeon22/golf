<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#1f5e3a">
<title>미니 골프</title>
<style>
:root{
  --bg:#173d2a;
  --ink:#ffffff;
  --accent:#ffd84d;
  --panel:rgba(12,36,24,.88);
  --line:rgba(255,255,255,.18);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--ink);
  font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
#wrap{position:relative;width:100%;height:100%;max-width:560px;margin:0 auto}
canvas{display:block;width:100%;height:100%;cursor:crosshair}

#hud{position:absolute;top:0;left:0;right:0;height:60px;padding:0 16px;display:none;align-items:center;justify-content:space-between;
  font-weight:800;pointer-events:none}
#hud.on{display:flex}
.chip{display:flex;flex-direction:column;align-items:center;line-height:1.1}
.chip small{font-size:11px;opacity:.75;font-weight:700}
.chip span{font-size:20px}
.chip.hl span{color:var(--accent)}

.overlay{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;
  padding:24px 16px;text-align:center;background:rgba(10,30,20,.72);backdrop-filter:blur(2px)}
.overlay.on{display:flex}
.logo{font-size:52px;font-weight:900;letter-spacing:-1px;line-height:1;color:#fff;text-shadow:0 5px 0 #0e7a43,0 9px 0 rgba(0,0,0,.3)}
.logo em{font-style:normal;color:var(--accent)}
.tag{margin:14px 0 22px;opacity:.9}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px 18px;max-width:360px;width:100%;
  margin-bottom:20px;font-size:14px;line-height:1.7;text-align:left}
.big{font-size:42px;font-weight:900;color:var(--accent);text-shadow:0 4px 0 rgba(0,0,0,.3);margin-bottom:6px}
.sub{font-size:16px;opacity:.9;margin-bottom:18px}
.btn{appearance:none;border:0;cursor:pointer;font:inherit;font-weight:900;font-size:21px;color:#123;
  background:linear-gradient(180deg,#fff27a,#ffc93c);padding:13px 44px;border-radius:999px;
  box-shadow:0 6px 0 #b8860b,0 10px 20px rgba(0,0,0,.3);transition:transform .08s}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #b8860b}
table{width:100%;border-collapse:collapse;font-size:15px;text-align:center}
th,td{padding:5px 2px;border-bottom:1px solid var(--line)}
th{font-size:12px;opacity:.7;font-weight:700}
tfoot td{font-weight:900;border-bottom:0;color:var(--accent)}
.under{color:#7dffb0}.over{color:#ff9a8a}
.hint{margin-top:14px;font-size:12px;opacity:.65}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game"></canvas>

  <div id="hud">
    <div class="chip"><small>홀</small><span id="hHole">1/5</span></div>
    <div class="chip"><small>파</small><span id="hPar">2</span></div>
    <div class="chip hl"><small>타수</small><span id="hStroke">0</span></div>
    <div class="chip"><small>합계</small><span id="hTotal">E</span></div>
  </div>

  <div class="overlay on" id="title">
    <div class="logo">미니 <em>골프</em></div>
    <div class="tag">5개 홀, 최소 타수에 도전하세요</div>
    <div class="card">
      <div>🏌️ <b>공을 끌었다 놓으면</b> 반대 방향으로 날아가요 (새총처럼)</div>
      <div>💪 많이 끌수록 세게 쳐요</div>
      <div>🟫 벙커(모래)에서는 공이 빨리 멈춰요</div>
      <div>🌊 물에 빠지면 +1타, 원래 자리에서 다시 쳐요</div>
      <div>⛳ 너무 빠르면 홀컵을 지나쳐요</div>
    </div>
    <button class="btn" id="startBtn">시작하기</button>
    <div class="hint" id="bestTitle"></div>
  </div>

  <div class="overlay" id="holeDone">
    <div class="big" id="dLabel">파</div>
    <div class="sub" id="dSub"></div>
    <button class="btn" id="nextBtn">다음 홀</button>
  </div>

  <div class="overlay" id="final">
    <div class="big" id="fLabel">라운드 종료</div>
    <div class="card">
      <table>
        <thead><tr><th>홀</th><th>파</th><th>타수</th><th>±</th></tr></thead>
        <tbody id="fBody"></tbody>
        <tfoot><tr><td>합계</td><td id="fPar"></td><td id="fStroke"></td><td id="fDiff"></td></tr></tfoot>
      </table>
    </div>
    <div class="sub" id="fBest"></div>
    <button class="btn" id="againBtn">다시 하기</button>
  </div>
</div>

<script>
(() => {
'use strict';

const cvs = document.getElementById('game');
const ctx = cvs.getContext('2d');
const $ = id => document.getElementById(id);

// field is authored in a fixed 400x640 coordinate space and scaled to fit
const FW = 400, FH = 640, HUD_H = 60;
const BALL_R = 8, HOLE_R = 12, MAX_PULL = 150, MAX_SPEED = 1150;

// Each hole: start, cup, par, walls / sand / water as [x, y, w, h]
const HOLES = [
  { par: 2, start: [200, 570], cup: [200, 110],
    walls: [], sand: [[150, 300, 100, 60]], water: [] },
  { par: 3, start: [200, 570], cup: [200, 100],
    walls: [[70, 310, 260, 22]], sand: [[30, 180, 90, 70]], water: [] },
  { par: 3, start: [330, 580], cup: [80, 95],
    walls: [[260, 160, 20, 140]], sand: [[200, 60, 120, 70]], water: [[0, 280, 250, 130]] },
  { par: 3, start: [60, 585], cup: [340, 80],
    walls: [[0, 210, 285, 22], [115, 420, 285, 22]], sand: [[300, 470, 100, 80]], water: [] },
  { par: 4, start: [200, 590], cup: [200, 80],
    walls: [[180, 380, 40, 40], [60, 470, 60, 18], [280, 470, 60, 18]],
    sand: [[140, 120, 120, 30]],
    water: [[0, 190, 165, 110], [235, 190, 165, 110]] },
];

let W = 0, H = 0, scale = 1, ox = 0, oy = 0;
function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const r = cvs.getBoundingClientRect();
  W = r.width; H = r.height;
  cvs.width = Math.round(W * dpr); cvs.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  scale = Math.min((W - 16) / FW, (H - HUD_H - 12) / FH);
  ox = (W - FW * scale) / 2;
  oy = HUD_H + (H - HUD_H - FH * scale) / 2;
}
window.addEventListener('resize', resize);
resize();

function loadBest() { try { const v = localStorage.getItem('minigolf-best'); return v === null ? null : +v; } catch (e) { return null; } }
function saveBest(v) { try { localStorage.setItem('minigolf-best', String(v)); } catch (e) {} }
let best = loadBest();

// ---------- audio ----------
let actx = null;
function tone(f1, f2, dur, type, vol) {
  try {
    if (!actx) { const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return; actx = new AC(); }
    if (actx.state === 'suspended') actx.resume();
    const t = actx.currentTime, o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.setValueAtTime(f1, t); o.frequency.exponentialRampToValueAtTime(f2, t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(actx.destination); o.start(t); o.stop(t + dur + 0.02);
  } catch (e) {}
}
const sfx = {
  hit: p => tone(300 + p * 300, 120, 0.12, 'triangle', 0.15 + p * 0.15),
  wall: () => tone(220, 160, 0.06, 'square', 0.05),
  splash: () => tone(500, 80, 0.5, 'sine', 0.2),
  cup: () => { tone(660, 660, 0.1, 'sine', 0.15); setTimeout(() => tone(990, 990, 0.25, 'sine', 0.15), 110); },
};

// ---------- state ----------
const G = {
  mode: 'title',          // title | aim | roll | sink | splash | done | final
  hole: 0, strokes: 0, scores: [],
  ball: { x: 0, y: 0, vx: 0, vy: 0, r: BALL_R },
  last: { x: 0, y: 0 },
  drag: null,             // {x, y} current pointer in field coords while aiming
  t: 0, anim: 0,
  ripples: [], texts: [],
};

const cur = () => HOLES[G.hole];
const inRect = (x, y, r) => x >= r[0] && x <= r[0] + r[2] && y >= r[1] && y <= r[1] + r[3];

function loadHole(i) {
  G.hole = i; G.strokes = 0;
  const h = cur();
  Object.assign(G.ball, { x: h.start[0], y: h.start[1], vx: 0, vy: 0 });
  G.last = { x: h.start[0], y: h.start[1] };
  G.mode = 'aim'; G.drag = null; G.ripples = []; G.texts = [];
  updateHud();
}

function startRound() {
  G.scores = [];
  $('title').classList.remove('on');
  $('final').classList.remove('on');
  $('hud').classList.add('on');
  loadHole(0);
}

function totalDiff() {
  let d = 0;
  G.scores.forEach((s, i) => d += s - HOLES[i].par);
  return d;
}
const fmtDiff = d => d === 0 ? 'E' : (d > 0 ? '+' + d : String(d));

function updateHud() {
  $('hHole').textContent = (G.hole + 1) + '/' + HOLES.length;
  $('hPar').textContent = cur().par;
  $('hStroke').textContent = G.strokes;
  $('hTotal').textContent = fmtDiff(totalDiff());
}

function label(strokes, par) {
  if (strokes === 1) return '홀인원! 🎉';
  const d = strokes - par;
  return ({ '-3': '앨버트로스!', '-2': '이글!', '-1': '버디!', '0': '파', '1': '보기', '2': '더블 보기', '3': '트리플 보기' })[d]
    || (d < 0 ? '대단해요!' : '+' + d);
}

function finishHole() {
  G.scores.push(G.strokes);
  G.mode = 'done';
  const h = cur();
  $('dLabel').textContent = label(G.strokes, h.par);
  $('dSub').textContent = `${G.hole + 1}번 홀 · 파 ${h.par} · ${G.strokes}타`;
  $('nextBtn').textContent = G.hole + 1 < HOLES.length ? '다음 홀' : '결과 보기';
  updateHud();
  setTimeout(() => $('holeDone').classList.add('on'), 400);
}

function next() {
  $('holeDone').classList.remove('on');
  if (G.hole + 1 < HOLES.length) loadHole(G.hole + 1);
  else showFinal();
}

function showFinal() {
  G.mode = 'final';
  $('hud').classList.remove('on');
  const body = $('fBody'); body.innerHTML = '';
  let tp = 0, ts = 0;
  HOLES.forEach((h, i) => {
    const s = G.scores[i], d = s - h.par;
    tp += h.par; ts += s;
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${i + 1}</td><td>${h.par}</td><td>${s}</td><td class="${d < 0 ? 'under' : d > 0 ? 'over' : ''}">${fmtDiff(d)}</td>`;
    body.appendChild(tr);
  });
  const d = ts - tp;
  $('fPar').textContent = tp; $('fStroke').textContent = ts; $('fDiff').textContent = fmtDiff(d);
  $('fLabel').textContent = d < 0 ? '언더파! 🏆' : d === 0 ? '이븐파!' : '라운드 종료';
  let msg;
  if (best === null || ts < best) { msg = best === null ? `첫 기록 ${ts}타` : `🏆 최고 기록 갱신! (${best}타 → ${ts}타)`; best = ts; saveBest(ts); }
  else msg = `최고 기록 ${best}타`;
  $('fBest').textContent = msg;
  $('final').classList.add('on');
}

// ---------- physics ----------
function collideRect(b, r) {
  const cx = Math.max(r[0], Math.min(b.x, r[0] + r[2]));
  const cy = Math.max(r[1], Math.min(b.y, r[1] + r[3]));
  const dx = b.x - cx, dy = b.y - cy;
  const d2 = dx * dx + dy * dy;
  if (d2 >= b.r * b.r) return false;
  let nx, ny, pen;
  if (d2 === 0) {
    // centre inside the rect: push out along the shallowest axis
    const l = b.x - r[0], rt = r[0] + r[2] - b.x, t = b.y - r[1], bt = r[1] + r[3] - b.y;
    const m = Math.min(l, rt, t, bt);
    nx = m === l ? -1 : m === rt ? 1 : 0;
    ny = nx ? 0 : (m === t ? -1 : 1);
    pen = m + b.r;
  } else {
    const d = Math.sqrt(d2);
    nx = dx / d; ny = dy / d; pen = b.r - d;
  }
  b.x += nx * pen; b.y += ny * pen;
  const vn = b.vx * nx + b.vy * ny;
  if (vn < 0) {
    b.vx -= 1.75 * vn * nx; b.vy -= 1.75 * vn * ny;  // restitution 0.75
    if (-vn > 60) sfx.wall();
  }
  return true;
}

function step(dt) {
  const b = G.ball, h = cur();
  const sub = 6, sdt = dt / sub;
  for (let i = 0; i < sub; i++) {
    b.x += b.vx * sdt; b.y += b.vy * sdt;
    // outer boundary
    if (b.x < b.r) { b.x = b.r; if (b.vx < 0) { b.vx *= -0.75; sfx.wall(); } }
    if (b.x > FW - b.r) { b.x = FW - b.r; if (b.vx > 0) { b.vx *= -0.75; sfx.wall(); } }
    if (b.y < b.r) { b.y = b.r; if (b.vy < 0) { b.vy *= -0.75; sfx.wall(); } }
    if (b.y > FH - b.r) { b.y = FH - b.r; if (b.vy > 0) { b.vy *= -0.75; sfx.wall(); } }
    for (const w of h.walls) collideRect(b, w);
  }

  const inSand = h.sand.some(r => inRect(b.x, b.y, r));
  const k = inSand ? 4.5 : 1.0;
  const sp = Math.hypot(b.vx, b.vy);
  if (sp > 0) {
    const ns = Math.max(0, sp * Math.exp(-k * dt) - (inSand ? 120 : 40) * dt);
    b.vx *= ns / sp; b.vy *= ns / sp;
  }

  // cup: slow enough → drop in; nearby → gentle pull toward the lip
  const dx = h.cup[0] - b.x, dy = h.cup[1] - b.y, dc = Math.hypot(dx, dy);
  const s2 = Math.hypot(b.vx, b.vy);
  if (dc < HOLE_R && s2 < 420) {
    G.mode = 'sink'; G.anim = 0; sfx.cup();
    return;
  }
  if (dc < HOLE_R * 1.8 && dc > 0) {
    const pull = 260 * dt;
    b.vx += dx / dc * pull; b.vy += dy / dc * pull;
  }

  if (h.water.some(r => inRect(b.x, b.y, r))) {
    G.mode = 'splash'; G.anim = 0; sfx.splash();
    G.strokes++; updateHud();
    for (let i = 0; i < 3; i++) G.ripples.push({ x: b.x, y: b.y, t: -i * 0.15 });
    G.texts.push({ text: '퐁당! +1타', x: b.x, y: b.y - 20, life: 1.2 });
    b.vx = b.vy = 0;
    return;
  }

  if (Math.hypot(b.vx, b.vy) < 8) {
    b.vx = b.vy = 0;
    G.mode = 'aim';
    G.last = { x: b.x, y: b.y };
  }
}

function update(dt) {
  G.t += dt;
  if (G.mode === 'roll') step(dt);
  else if (G.mode === 'sink') {
    G.anim += dt;
    const h = cur();
    G.ball.x += (h.cup[0] - G.ball.x) * Math.min(1, dt * 12);
    G.ball.y += (h.cup[1] - G.ball.y) * Math.min(1, dt * 12);
    if (G.anim > 0.35 && G.mode === 'sink') { G.mode = 'sunk'; finishHole(); }
  } else if (G.mode === 'splash') {
    G.anim += dt;
    if (G.anim > 0.9) {
      Object.assign(G.ball, { x: G.last.x, y: G.last.y, vx: 0, vy: 0 });
      G.mode = 'aim';
    }
  }
  for (const r of G.ripples) r.t += dt;
  G.ripples = G.ripples.filter(r => r.t < 1);
  for (const t of G.texts) { t.life -= dt; t.y -= 30 * dt; }
  G.texts = G.texts.filter(t => t.life > 0);
}

// ---------- input ----------
function toField(e) {
  const r = cvs.getBoundingClientRect();
  return { x: (e.clientX - r.left - ox) / scale, y: (e.clientY - r.top - oy) / scale };
}
function aimVec() {
  const b = G.ball;
  let dx = b.x - G.drag.x, dy = b.y - G.drag.y;
  const d = Math.hypot(dx, dy);
  const p = Math.min(d, MAX_PULL) / MAX_PULL;
  return { nx: d ? dx / d : 0, ny: d ? dy / d : 0, p };
}
cvs.addEventListener('pointerdown', e => {
  if (G.mode !== 'aim') return;
  cvs.setPointerCapture(e.pointerId);
  G.drag = toField(e);
});
cvs.addEventListener('pointermove', e => { if (G.drag) G.drag = toField(e); });
cvs.addEventListener('pointerup', e => {
  if (!G.drag || G.mode !== 'aim') { G.drag = null; return; }
  G.drag = toField(e);
  const a = aimVec();
  G.drag = null;
  if (a.p < 0.05) return;
  G.ball.vx = a.nx * a.p * MAX_SPEED;
  G.ball.vy = a.ny * a.p * MAX_SPEED;
  G.last = { x: G.ball.x, y: G.ball.y };
  G.strokes++; updateHud();
  G.mode = 'roll';
  sfx.hit(a.p);
});
cvs.addEventListener('pointercancel', () => { G.drag = null; });

$('startBtn').addEventListener('click', startRound);
$('nextBtn').addEventListener('click', next);
$('againBtn').addEventListener('click', startRound);
window.addEventListener('keydown', e => {
  if (e.key !== 'Enter' && e.key !== ' ') return;
  if (G.mode === 'title') startRound();
  else if (G.mode === 'sunk' && $('holeDone').classList.contains('on')) next();
  else if (G.mode === 'final') startRound();
  else return;
  e.preventDefault();
});
Object.assign(G.ball, { x: HOLES[0].start[0], y: HOLES[0].start[1] });
if (best !== null) $('bestTitle').textContent = `최고 기록 ${best}타`;

// ---------- render ----------
function render() {
  ctx.fillStyle = '#173d2a';
  ctx.fillRect(0, 0, W, H);

  ctx.save();
  ctx.translate(ox, oy);
  ctx.scale(scale, scale);
  const h = cur();

  // fairway with mowing stripes
  ctx.fillStyle = '#0f2e1f';
  ctx.beginPath(); ctx.roundRect ? ctx.roundRect(-8, -8, FW + 16, FH + 16, 18) : ctx.rect(-8, -8, FW + 16, FH + 16); ctx.fill();
  for (let i = 0; i < 16; i++) {
    ctx.fillStyle = i % 2 ? '#4caf50' : '#43a047';
    ctx.fillRect(0, i * FH / 16, FW, FH / 16 + 1);
  }

  // water
  for (const r of h.water) {
    ctx.fillStyle = '#1e88e5';
    ctx.fillRect(r[0], r[1], r[2], r[3]);
    ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.lineWidth = 2;
    for (let yy = r[1] + 18; yy < r[1] + r[3] - 6; yy += 24) {
      ctx.beginPath();
      for (let xx = r[0] + 8; xx < r[0] + r[2] - 8; xx += 4) {
        const y = yy + Math.sin(xx * 0.08 + G.t * 2.5) * 3;
        xx === r[0] + 8 ? ctx.moveTo(xx, y) : ctx.lineTo(xx, y);
      }
      ctx.stroke();
    }
    ctx.strokeStyle = '#1565c0'; ctx.lineWidth = 3; ctx.strokeRect(r[0] + 1.5, r[1] + 1.5, r[2] - 3, r[3] - 3);
  }

  // sand
  for (const r of h.sand) {
    ctx.fillStyle = '#e8d29a';
    ctx.beginPath();
    ctx.ellipse(r[0] + r[2] / 2, r[1] + r[3] / 2, r[2] / 2, r[3] / 2, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = 'rgba(170,140,80,.35)';
    for (let i = 0; i < 14; i++) {
      const a = i * 2.4, rr = 0.6 * ((i * 37) % 10) / 10;
      ctx.fillRect(r[0] + r[2] / 2 + Math.cos(a) * r[2] / 2 * rr, r[1] + r[3] / 2 + Math.sin(a) * r[3] / 2 * rr, 2, 2);
    }
  }

  // walls
  for (const r of h.walls) {
    ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.fillRect(r[0] + 3, r[1] + 4, r[2], r[3]);
    ctx.fillStyle = '#8d5a2b'; ctx.fillRect(r[0], r[1], r[2], r[3]);
    ctx.fillStyle = '#a86f3a'; ctx.fillRect(r[0], r[1], r[2], Math.min(5, r[3]));
  }

  // tee marker
  ctx.fillStyle = 'rgba(255,255,255,.25)';
  ctx.beginPath(); ctx.arc(h.start[0], h.start[1], 14, 0, Math.PI * 2); ctx.fill();

  // cup + flag
  const [cx, cy] = h.cup;
  ctx.fillStyle = '#2e7d32';
  ctx.beginPath(); ctx.arc(cx, cy, HOLE_R + 5, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#111';
  ctx.beginPath(); ctx.arc(cx, cy, HOLE_R, 0, Math.PI * 2); ctx.fill();
  const showFlag = G.mode !== 'sink' && G.mode !== 'sunk';
  if (showFlag) {
    ctx.strokeStyle = '#eee'; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx, cy - 46); ctx.stroke();
    const wave = Math.sin(G.t * 4) * 3;
    ctx.fillStyle = '#ff3b4f';
    ctx.beginPath(); ctx.moveTo(cx, cy - 46); ctx.lineTo(cx + 26, cy - 39 + wave); ctx.lineTo(cx, cy - 32); ctx.closePath(); ctx.fill();
  }

  // ripples
  for (const r of G.ripples) {
    if (r.t < 0) continue;
    ctx.strokeStyle = `rgba(255,255,255,${1 - r.t})`; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(r.x, r.y, 4 + r.t * 30, 0, Math.PI * 2); ctx.stroke();
  }

  // aim guide
  const b = G.ball;
  if (G.drag && G.mode === 'aim') {
    const a = aimVec();
    if (a.p > 0.02) {
      const len = 40 + a.p * 160;
      const col = a.p < 0.5 ? '#ffffff' : a.p < 0.85 ? '#ffd84d' : '#ff5a4f';
      ctx.fillStyle = col;
      for (let d = 18; d < len; d += 12) {
        ctx.globalAlpha = 1 - d / (len + 20);
        ctx.beginPath(); ctx.arc(b.x + a.nx * d, b.y + a.ny * d, 3, 0, Math.PI * 2); ctx.fill();
      }
      ctx.globalAlpha = 1;
      // pull line
      ctx.strokeStyle = 'rgba(255,255,255,.4)'; ctx.lineWidth = 2; ctx.setLineDash([4, 5]);
      ctx.beginPath(); ctx.moveTo(b.x, b.y); ctx.lineTo(b.x - a.nx * a.p * MAX_PULL, b.y - a.ny * a.p * MAX_PULL); ctx.stroke();
      ctx.setLineDash([]);
      // power meter
      ctx.fillStyle = 'rgba(0,0,0,.45)'; ctx.fillRect(b.x - 26, b.y + 16, 52, 7);
      ctx.fillStyle = col; ctx.fillRect(b.x - 26, b.y + 16, 52 * a.p, 7);
    }
  } else if (G.mode === 'aim' && G.strokes === 0) {
    ctx.strokeStyle = `rgba(255,255,255,${0.5 + 0.4 * Math.sin(G.t * 4)})`; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(b.x, b.y, 16 + Math.sin(G.t * 4) * 2, 0, Math.PI * 2); ctx.stroke();
  }

  // ball
  if (G.mode !== 'splash' && G.mode !== 'sunk') {
    const shrink = G.mode === 'sink' ? Math.max(0.2, 1 - G.anim * 2.2) : 1;
    ctx.fillStyle = 'rgba(0,0,0,.28)';
    ctx.beginPath(); ctx.ellipse(b.x + 2, b.y + 3, b.r * shrink, b.r * 0.8 * shrink, 0, 0, Math.PI * 2); ctx.fill();
    const g = ctx.createRadialGradient(b.x - 3, b.y - 3, 1, b.x, b.y, b.r * shrink);
    g.addColorStop(0, '#ffffff'); g.addColorStop(1, '#d6d6d6');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r * shrink, 0, Math.PI * 2); ctx.fill();
  }

  // floating text
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = '900 20px system-ui,"Malgun Gothic",sans-serif';
  for (const t of G.texts) {
    ctx.globalAlpha = Math.min(1, t.life * 2);
    ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(0,0,0,.5)'; ctx.strokeText(t.text, t.x, t.y);
    ctx.fillStyle = '#fff'; ctx.fillText(t.text, t.x, t.y);
  }
  ctx.globalAlpha = 1;
  ctx.restore();
}

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.033, (now - last) / 1000);
  last = now;
  update(dt);
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
